<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">招聘助手工作流程说明图</title>
  <desc id="desc">从招聘邮件进入邮箱，到 AI 解析，再到任务列表管理，最后显示桌面提醒的四步流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f7fbf4"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7fafc"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="146%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3277c9"/>
    </marker>
    <style>
      .title { font: 800 54px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 500 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526173; }
      .card-title { font: 800 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182235; }
      .card-copy { font: 500 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #586679; }
      .tag { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2563a8; }
      .small { font: 650 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .mono { font: 700 17px "SF Mono", Menlo, Consolas, monospace; fill: #466074; }
    </style>
  </defs>

  <rect width="1400" height="760" rx="0" fill="url(#bg)"/>
  <circle cx="1280" cy="120" r="112" fill="#b7e4d3" opacity="0.35"/>
  <circle cx="120" cy="660" r="128" fill="#b7d4ff" opacity="0.35"/>

  <text x="92" y="94" class="title">AI Recruitment Assistant</text>
  <text x="94" y="136" class="subtitle">把招聘邮件自动整理成清晰、可提醒的桌面任务</text>

  <g transform="translate(80 214)">
    <rect x="0" y="0" width="270" height="330" rx="26" fill="url(#panel)" stroke="#d9e4ef" filter="url(#shadow)"/>
    <rect x="28" y="28" width="214" height="128" rx="22" fill="#e8f2ff" stroke="#bdd7f5"/>
    <path d="M65 68 h140 a13 13 0 0 1 13 13 v48 a13 13 0 0 1 -13 13 H65 a13 13 0 0 1 -13 -13 V81 a13 13 0 0 1 13 -13z" fill="#ffffff" stroke="#7fb1e8" stroke-width="4"/>
    <path d="M55 80 l80 56 l80 -56" fill="none" stroke="#3277c9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="31" y="201" class="tag">STEP 1</text>
    <text x="31" y="240" class="card-title">拉取招聘邮件</text>
    <text x="31" y="277" class="card-copy">通过 IMAP 读取邮箱</text>
    <text x="31" y="305" class="card-copy">用 UID 防止重复抓取</text>
  </g>

  <path d="M375 379 H480" fill="none" stroke="#3277c9" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(505 214)">
    <rect x="0" y="0" width="270" height="330" rx="26" fill="url(#panel)" stroke="#d9e4ef" filter="url(#shadow)"/>
    <rect x="34" y="30" width="202" height="128" rx="24" fill="#edf7ef" stroke="#b9dfbf"/>
    <circle cx="103" cy="94" r="34" fill="#39a86b"/>
    <circle cx="167" cy="94" r="34" fill="#2f7ed0"/>
    <path d="M103 78 v32 M87 94 h32 M151 84 h32 M151 104 h32" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <text x="31" y="201" class="tag">STEP 2</text>
    <text x="31" y="240" class="card-title">AI 自动解析</text>
    <text x="31" y="277" class="card-copy">识别公司、时间、类型</text>
    <text x="31" y="305" class="card-copy">面试 / 笔试 / 测评</text>
  </g>

  <path d="M800 379 H905" fill="none" stroke="#3277c9" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(930 214)">
    <rect x="0" y="0" width="270" height="330" rx="26" fill="url(#panel)" stroke="#d9e4ef" filter="url(#shadow)"/>
    <rect x="37" y="32" width="196" height="132" rx="22" fill="#fff7e7" stroke="#efd59f"/>
    <rect x="61" y="58" width="148" height="18" rx="9" fill="#f1a936"/>
    <rect x="61" y="90" width="110" height="16" rx="8" fill="#75b58b"/>
    <rect x="61" y="120" width="132" height="16" rx="8" fill="#7ea6d8"/>
    <text x="31" y="201" class="tag">STEP 3</text>
    <text x="31" y="240" class="card-title">生成任务列表</text>
    <text x="31" y="277" class="card-copy">动态分类、历史归档</text>
    <text x="31" y="305" class="card-copy">集中追踪招聘进展</text>
  </g>

  <path d="M1065 562 C1065 640 245 640 245 562" fill="none" stroke="#9ebfe6" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 14" marker-end="url(#arrow)"/>

  <g transform="translate(475 576)">
    <rect x="0" y="0" width="452" height="92" rx="24" fill="#ffffff" stroke="#d8e5ee" filter="url(#shadow)"/>
    <circle cx="55" cy="46" r="21" fill="#ff6b6b"/>
    <path d="M55 31 v22" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="55" cy="63" r="4" fill="#ffffff"/>
    <text x="92" y="39" class="label">桌面提醒</text>
    <text x="92" y="66" class="small">临近任务高亮显示，跨平台悬浮查看</text>
  </g>

  <g transform="translate(96 642)">
    <rect x="0" y="0" width="254" height="50" rx="16" fill="#ffffff" stroke="#d7e3ee"/>
    <text x="24" y="31" class="mono">QQ 邮箱 / IMAP</text>
  </g>
  <g transform="translate(574 642)">
    <rect x="0" y="0" width="254" height="50" rx="16" fill="#ffffff" stroke="#d7e3ee"/>
    <text x="24" y="31" class="mono">DeepSeek / OpenAI</text>
  </g>
  <g transform="translate(1048 642)">
    <rect x="0" y="0" width="254" height="50" rx="16" fill="#ffffff" stroke="#d7e3ee"/>
    <text x="24" y="31" class="mono">pywebview UI</text>
  </g>
</svg>
