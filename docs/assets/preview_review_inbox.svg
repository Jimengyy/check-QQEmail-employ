<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      * { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .text-title { font-size: 20px; font-weight: 800; fill: #1E293B; }
      .text-subtitle { font-size: 13px; font-weight: 500; fill: #64748B; }
      .text-nav { font-size: 14px; font-weight: 600; fill: #475569; }
      .text-nav-active { font-size: 14px; font-weight: 700; fill: #0F172A; }
    </style>
    
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
    <filter id="btnShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10B981" flood-opacity="0.25"/>
    </filter>

    <linearGradient id="primaryBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="emeraldBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1440" height="900" fill="#FDFCF8"/>

  <!-- ==================== LEAN SIDEBAR (240px) ==================== -->
  <g id="leanSidebar">
    <rect x="0" y="0" width="240" height="900" fill="#F6F4ED" stroke="#EBE7DE" stroke-width="1"/>

    <!-- Brand -->
    <g transform="translate(24, 32)">
      <text x="0" y="20" font-size="19" font-weight="900" fill="#0F172A">✦ OfferPilot</text>
      <rect x="114" y="4" width="42" height="20" rx="10" fill="#E2DDD2"/>
      <text x="122" y="18" font-size="10.5" font-weight="800" fill="#64748B">ATS</text>
    </g>

    <!-- Global Action Button -->
    <g transform="translate(20, 78)">
      <rect x="0" y="0" width="200" height="40" rx="20" fill="url(#primaryBtn)" filter="url(#btnShadow)"/>
      <text x="44" y="25" font-size="13.5" font-weight="700" fill="#FFFFFF">➕ 手动建档 / 推进</text>
    </g>

    <!-- Core 2 Master Views -->
    <g transform="translate(20, 146)">
      <!-- Nav 1: Dashboard -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="200" height="42" rx="10" fill="transparent"/>
        <text x="18" y="26" class="text-nav">📊 求职全景看板</text>
      </g>

      <!-- Nav 2: Review Inbox (Active State) -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="200" height="42" rx="10" fill="#FFFFFF" filter="url(#softShadow)"/>
        <rect x="0" y="11" width="3.5" height="20" rx="1.75" fill="#EF4444"/>
        <text x="18" y="26" class="text-nav-active">📬 邮件待审准入</text>
        <rect x="156" y="11" width="32" height="20" rx="10" fill="#EF4444"/>
        <text x="165" y="25" font-size="11" font-weight="800" fill="#FFFFFF">14</text>
      </g>
    </g>

    <!-- Bottom Tools -->
    <g transform="translate(20, 755)">
      <line x1="0" y1="0" x2="200" y2="0" stroke="#E8E4DB" stroke-width="1"/>
      <g transform="translate(0, 14)">
        <rect x="0" y="0" width="200" height="34" rx="8" fill="#ECE8DF" stroke="#DFD9CD" stroke-width="1"/>
        <text x="42" y="22" font-size="12" font-weight="700" fill="#475569">💻 唤醒桌面透明挂件</text>
      </g>
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="200" height="36" rx="8" fill="#E8E4DA"/>
        <circle cx="20" cy="18" r="4" fill="#10B981"/>
        <text x="32" y="22" font-size="11.5" font-weight="700" fill="#065F46">云端 Realtime 已连接</text>
        <text x="175" y="22" font-size="13" fill="#64748B">⚙️</text>
      </g>
    </g>
  </g>

  <!-- ==================== MAIN REVIEW INBOX AREA ==================== -->
  <g transform="translate(272, 0)">
    <!-- Top Header -->
    <g transform="translate(0, 28)">
      <text x="0" y="22" class="text-title">📬 邮件待审与准入门禁 (Review Gatekeeper)</text>
      <text x="0" y="44" class="text-subtitle">由云端 DeepSeek AI 实时抓取解析 · 请确认是否为本人真实求职通知并放行</text>

      <!-- Right Action Bar -->
      <g transform="translate(620, 4)">
        <!-- Internal Sub-tabs: 待审核 & 已忽略归档 (De-duplicated) -->
        <rect x="0" y="0" width="230" height="36" rx="18" fill="#E8E4DB"/>
        <rect x="3" y="3" width="115" height="30" rx="15" fill="#0F172A"/>
        <text x="18" y="23" font-size="12" font-weight="700" fill="#FFFFFF">📬 待审核 (14)</text>
        <text x="132" y="23" font-size="12" font-weight="600" fill="#64748B">📦 已忽略 (2)</text>

        <!-- Batch Approve Button -->
        <rect x="245" y="0" width="175" height="36" rx="18" fill="url(#purpleBtn)" filter="url(#softShadow)"/>
        <text x="262" y="23" font-size="13" font-weight="700" fill="#FFFFFF">⚡️ 一键全选准入 (14)</text>
      </g>
    </g>

    <!-- Review Table Card Container -->
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="1128" height="760" rx="16" fill="#FFFFFF" stroke="#EBE7DE" filter="url(#softShadow)"/>

      <!-- Table Header -->
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="1088" height="38" rx="8" fill="#F8FAFC"/>
        <text x="20" y="24" font-size="12" font-weight="700" fill="#64748B">抓取时间</text>
        <text x="120" y="24" font-size="12" font-weight="700" fill="#64748B">目标企业 / 投递岗位</text>
        <text x="360" y="24" font-size="12" font-weight="700" fill="#64748B">提炼环节</text>
        <text x="490" y="24" font-size="12" font-weight="700" fill="#64748B">本轮等待预期</text>
        <text x="680" y="24" font-size="12" font-weight="700" fill="#64748B">约定时间</text>
        <text x="810" y="24" font-size="12" font-weight="700" fill="#64748B">凭据 / 官网 / 备注</text>
        <text x="990" y="24" font-size="12" font-weight="700" fill="#64748B">审核决策</text>
      </g>

      <!-- Row 1: 南京841研究所 -->
      <g transform="translate(20, 70)">
        <rect x="0" y="0" width="1088" height="64" rx="8" fill="#FFFFFF" stroke="#F1F5F9"/>
        <text x="20" y="38" font-size="13" font-weight="500" fill="#64748B">8/22 00:06</text>
        <rect x="120" y="16" width="32" height="32" rx="6" fill="#3B82F6"/>
        <text x="130" y="37" font-size="14" font-weight="700" fill="#FFF">南</text>
        <text x="160" y="30" font-size="14" font-weight="700" fill="#0F172A">南京841研究所</text>
        <text x="160" y="46" font-size="11" fill="#64748B">计算机、信息安全、人工智能方向</text>

        <!-- Stage Badge -->
        <rect x="360" y="20" width="88" height="24" rx="12" fill="#FEF3C7"/>
        <text x="372" y="36" font-size="11" font-weight="700" fill="#D97706">🎪 夏令营邀请</text>

        <text x="490" y="38" font-size="12" fill="#475569">等待简历初筛与短信邀约</text>
        <text x="680" y="38" font-size="13" font-weight="700" fill="#0F172A">📅 2026-08-15</text>
        <text x="810" y="38" font-size="12" fill="#94A3B8">—</text>

        <!-- Action Buttons -->
        <rect x="955" y="16" width="68" height="32" rx="16" fill="url(#emeraldBtn)" filter="url(#emeraldGlow)"/>
        <text x="970" y="36" font-size="12" font-weight="700" fill="#FFF">✓ 准入</text>
        <rect x="1030" y="16" width="48" height="32" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="1042" y="36" font-size="12" font-weight="600" fill="#64748B">✕ 忽略</text>
      </g>

      <!-- Row 2: 网易游戏互娱 -->
      <g transform="translate(20, 142)">
        <rect x="0" y="0" width="1088" height="64" rx="8" fill="#FFFFFF" stroke="#F1F5F9"/>
        <text x="20" y="38" font-size="13" font-weight="500" fill="#64748B">8/22 00:06</text>
        <rect x="120" y="16" width="32" height="32" rx="6" fill="#0284C7"/>
        <text x="130" y="37" font-size="14" font-weight="700" fill="#FFF">网</text>
        <text x="160" y="30" font-size="14" font-weight="700" fill="#0F172A">网易游戏 互娱</text>
        <text x="160" y="46" font-size="11" fill="#64748B">2027届校招岗位</text>

        <!-- Stage Badge -->
        <rect x="360" y="20" width="88" height="24" rx="12" fill="#EEF2FF"/>
        <text x="372" y="36" font-size="11" font-weight="700" fill="#4F46E5">🎯 投递邀请</text>

        <text x="490" y="38" font-size="12" fill="#475569">等待投递官方网站</text>
        <text x="680" y="38" font-size="12" fill="#94A3B8">待推进通知</text>
        <text x="810" y="38" font-size="12" fill="#94A3B8">—</text>

        <rect x="955" y="16" width="68" height="32" rx="16" fill="url(#emeraldBtn)" filter="url(#emeraldGlow)"/>
        <text x="970" y="36" font-size="12" font-weight="700" fill="#FFF">✓ 准入</text>
        <rect x="1030" y="16" width="48" height="32" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="1042" y="36" font-size="12" font-weight="600" fill="#64748B">✕ 忽略</text>
      </g>

      <!-- Row 3: 中信期货 -->
      <g transform="translate(20, 214)">
        <rect x="0" y="0" width="1088" height="64" rx="8" fill="#FFFFFF" stroke="#F1F5F9"/>
        <text x="20" y="38" font-size="13" font-weight="500" fill="#64748B">8/22 00:07</text>
        <rect x="120" y="16" width="32" height="32" rx="6" fill="#D97706"/>
        <text x="130" y="37" font-size="14" font-weight="700" fill="#FFF">中</text>
        <text x="160" y="30" font-size="14" font-weight="700" fill="#0F172A">中信期货</text>
        <text x="160" y="46" font-size="11" fill="#64748B">2027届未来星校园招聘</text>

        <rect x="360" y="20" width="88" height="24" rx="12" fill="#F1F5F9"/>
        <text x="372" y="36" font-size="11" font-weight="700" fill="#475569">📬 网申投递</text>

        <text x="490" y="38" font-size="12" fill="#475569">等待简历初筛结果</text>
        <text x="680" y="38" font-size="12" fill="#475569">截止: 10-18</text>

        <!-- Link Capsule -->
        <rect x="810" y="18" width="110" height="26" rx="13" fill="#EEF2FF" stroke="#C7D2FE"/>
        <text x="822" y="35" font-size="11" font-weight="700" fill="#4F46E5">🔗 官网链接 ↗</text>

        <rect x="955" y="16" width="68" height="32" rx="16" fill="url(#emeraldBtn)" filter="url(#emeraldGlow)"/>
        <text x="970" y="36" font-size="12" font-weight="700" fill="#FFF">✓ 准入</text>
        <rect x="1030" y="16" width="48" height="32" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="1042" y="36" font-size="12" font-weight="600" fill="#64748B">✕ 忽略</text>
      </g>
    </g>
  </g>
</svg>
