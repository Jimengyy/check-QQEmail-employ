<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">招聘助手 V3.0 新人极速上线流转图 (Fork 零代码模式)</title>
  <desc id="desc">展示从准备免费平台密钥，到 GitHub 网页一键 Fork 与配置 Secrets，再到下载 Mac DMG 粘贴连接的完整 6 步指引。</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#18182f"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>

    <linearGradient id="blueBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="purpleBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="greenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>

    <style>
      .title { font: 900 32px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #ffffff; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94a3b8; }
      .badge { font: 800 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #38bdf8; letter-spacing: 1px; }
      .h1 { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #f8fafc; }
      .desc { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #cbd5e1; }
      .highlight { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #38bdf8; }
    </style>
  </defs>

  <rect width="1440" height="520" fill="url(#bgGrad)"/>

  <!-- Top Title -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="6" height="42" rx="3" fill="url(#blueBar)"/>
    <text x="20" y="24" class="title">⚡️ 新手 5 分钟极速上线指南 (Fork 零代码模式)</text>
    <text x="20" y="44" class="subtitle">准备免费平台密钥 ➔ 网页点击 Fork 并填 Secrets ➔ 下载 Mac 安装包一键开启</text>
  </g>

  <!-- Step 1 -->
  <g transform="translate(60, 110)">
    <rect width="200" height="350" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="2" y="2" width="196" height="4" rx="2" fill="url(#blueBar)"/>
    <text x="20" y="32" class="badge">STEP 01</text>
    <text x="20" y="58" class="h1">📨 邮箱授权码</text>
    
    <g transform="translate(20, 88)">
      <text y="0" class="highlight">QQ 邮箱设置</text>
      <text y="24" class="desc">• 网页进入【设置】</text>
      <text y="48" class="desc">• 开启 POP3/IMAP</text>
      <text y="72" class="desc">• 生成 16 位授权码</text>
      <text y="110" class="desc" fill="#94a3b8">作为云端连接凭据</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 270 280 L 290 280" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(300, 110)">
    <rect width="200" height="350" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="2" y="2" width="196" height="4" rx="2" fill="url(#purpleBar)"/>
    <text x="20" y="32" class="badge" fill="#c084fc">STEP 02</text>
    <text x="20" y="58" class="h1">🤖 AI 与数据库</text>

    <g transform="translate(20, 88)">
      <text y="0" class="highlight" fill="#c084fc">注册两项免费服务</text>
      <text y="24" class="desc">• DeepSeek 生成 Key</text>
      <text y="48" class="desc">• Supabase 执行 SQL</text>
      <text y="72" class="desc">• 开启 Realtime 广播</text>
      <text y="96" class="desc">• 复制 URL 与双 Key</text>
      <text y="125" class="desc" fill="#94a3b8">永久 100% 免费额度</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 510 280 L 530 280" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Fork Repo -->
  <g transform="translate(540, 110)">
    <rect width="200" height="350" rx="16" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="2" y="2" width="196" height="4" rx="2" fill="url(#blueBar)"/>
    <text x="20" y="32" class="badge" fill="#818cf8">STEP 03</text>
    <text x="20" y="58" class="h1">🍴 点击【Fork】</text>

    <g transform="translate(20, 88)">
      <text y="0" class="highlight" fill="#818cf8">一键复印云端大脑</text>
      <text y="24" class="desc">• 打开本项目 GitHub 页面</text>
      <text y="48" class="desc">• 点击右上角【Fork】</text>
      <text y="72" class="desc">• 免配 Python 环境</text>
      <text y="96" class="desc">• 免敲任何 Git 命令行</text>
      <text y="125" class="desc" fill="#94a3b8">代码自动进个人账号</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 750 280 L 770 280" fill="none" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Secrets -->
  <g transform="translate(780, 110)">
    <rect width="200" height="350" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="2" y="2" width="196" height="4" rx="2" fill="url(#purpleBar)"/>
    <text x="20" y="32" class="badge" fill="#c084fc">STEP 04</text>
    <text x="20" y="58" class="h1">🔒 填 5 个 Secrets</text>

    <g transform="translate(20, 88)">
      <text y="0" class="highlight" fill="#c084fc">激活 7x24h 抓取</text>
      <text y="24" class="desc">• 进入自己 Fork 的仓库</text>
      <text y="48" class="desc">• Settings ➔ Secrets</text>
      <text y="72" class="desc">• 填入邮箱/AI/数据库Key</text>
      <text y="96" class="desc">• 手动点击 Run workflow</text>
      <text y="125" class="desc" fill="#94a3b8">云端机器人即刻运转</text>
    </g>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 990 280 L 1010 280" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Download DMG -->
  <g transform="translate(1020, 110)">
    <rect width="180" height="350" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="2" y="2" width="176" height="4" rx="2" fill="url(#greenBar)"/>
    <text x="18" y="32" class="badge" fill="#34d399">STEP 05</text>
    <text x="18" y="58" class="h1">💿 下载安装包</text>

    <g transform="translate(18, 88)">
      <text y="0" class="highlight" fill="#34d399">安装 Mac 客户端</text>
      <text y="24" class="desc">• 在 Releases 页面</text>
      <text y="48" class="desc">• 下载 .dmg 安装包</text>
      <text y="72" class="desc">• 拖入 Applications</text>
      <text y="96" class="desc">• 填入 Supabase URL</text>
      <text y="125" class="desc" fill="#94a3b8">无需本地编译</text>
    </g>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M 1210 280 L 1230 280" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Step 6: Launch -->
  <g transform="translate(1240, 110)">
    <rect width="140" height="350" rx="16" fill="url(#cardGrad)" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <rect x="2" y="2" width="136" height="4" rx="2" fill="url(#greenBar)"/>
    <text x="16" y="32" class="badge" fill="#34d399">STEP 06</text>
    <text x="16" y="58" class="h1">🚀 完美上线</text>

    <g transform="translate(16, 88)">
      <text y="0" class="highlight" fill="#34d399">双击启动</text>
      <text y="24" class="desc">挂件浮现桌面</text>
      <text y="60" class="desc">后台审核邮件</text>
      <text y="84" class="desc">全端实时同步</text>
      <text y="120" class="desc" fill="#34d399" font-weight="700">🎉 享受求职开挂！</text>
    </g>
  </g>
</svg>
