<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      * { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .text-title { font-size: 18px; font-weight: 800; fill: #0F172A; }
      .text-label { font-size: 12.5px; font-weight: 700; fill: #334155; }
    </style>
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="primaryBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- 1. Background Canvas (Dimmed) -->
  <rect width="1440" height="900" fill="#FDFCF8"/>
  <rect width="1440" height="900" fill="rgba(15, 23, 42, 0.45)"/>

  <!-- ==================== CONFIG MODAL CONTAINER (520px) ==================== -->
  <g transform="translate(460, 200)" filter="url(#modalShadow)">
    <rect width="520" height="460" rx="18" fill="#FFFFFF" stroke="#E2DED5" stroke-width="1"/>

    <!-- Modal Header -->
    <g transform="translate(32, 32)">
      <rect x="0" y="0" width="40" height="40" rx="10" fill="#ECFDF5"/>
      <text x="11" y="27" font-size="18">⚡️</text>
      
      <text x="54" y="20" class="text-title">Supabase 云数据库连接配置</text>
      <text x="54" y="38" font-size="12" fill="#64748B">多端 Realtime 实时同步中枢与 7x24h 云端抓取存储</text>

      <circle cx="435" cy="18" r="14" fill="#F1F5F9"/>
      <text x="430" y="23" font-size="13" font-weight="700" fill="#64748B">✕</text>
    </g>

    <line x1="32" y1="92" x2="488" y2="92" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Form Fields -->
    <g transform="translate(32, 112)">
      <!-- Field 1: Project URL -->
      <g>
        <text x="0" y="14" class="text-label">Supabase Project URL</text>
        <rect x="0" y="24" width="456" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="14" y="49" font-size="13" fill="#0F172A">https://pmnrswjopdclnptmksfa.supabase.co</text>
      </g>

      <!-- Field 2: Anon Key -->
      <g transform="translate(0, 85)">
        <text x="0" y="14" class="text-label">Anon Public Key (公开公钥)</text>
        <rect x="0" y="24" width="456" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="14" y="49" font-size="13" fill="#64748B">sb_publishable_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...</text>
      </g>

      <!-- Status Banner -->
      <g transform="translate(0, 170)">
        <rect x="0" y="0" width="456" height="46" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
        <circle cx="20" cy="23" r="5" fill="#10B981"/>
        <text x="36" y="28" font-size="12.5" font-weight="700" fill="#065F46">✅ 云端连接正常！Realtime WebSocket 广播通道通畅</text>
      </g>
    </g>

    <!-- Modal Footer -->
    <g transform="translate(32, 385)">
      <line x1="0" y1="0" x2="456" y2="0" stroke="#F1F5F9" stroke-width="1.5"/>
      <rect x="250" y="18" width="80" height="38" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="276" y="42" font-size="13" font-weight="600" fill="#64748B">取消</text>

      <rect x="340" y="18" width="116" height="38" rx="8" fill="url(#primaryBtn)"/>
      <text x="354" y="42" font-size="13" font-weight="700" fill="#FFFFFF">⚡️ 保存并连接</text>
    </g>
  </g>
</svg>
