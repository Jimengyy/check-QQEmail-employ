name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
    tags:
      - 'v*'

jobs:
  build-apk:
    name: 📱 Build OfferPilot APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕️ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Sync Web Assets to Android Project
        run: |
          mkdir -p mobile/android/app/src/main/assets/public
          cp -r mobile/src/* mobile/android/app/src/main/assets/public/
          echo "✅ Assets synced successfully"

      - name: 🔨 Grant Execute Permission for Gradle Wrapper
        run: |
          cd mobile/android
          # If gradlew wrapper jar is not present, use gradle to assemble
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Installing Gradle..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle assembleDebug --no-daemon
          else
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          fi

      - name: 📦 Prepare APK Artifact
        run: |
          mkdir -p dist
          APK_PATH=$(find mobile/android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" dist/OfferPilot-v3.3.0.apk
            echo "✅ Output APK ready at dist/OfferPilot-v3.3.0.apk"
          else
            echo "❌ APK build output not found!"
            exit 1
          fi

      - name: 🚀 Upload APK Artifact (可直接在 GitHub 页面下载)
        uses: actions/upload-artifact@v4
        with:
          name: OfferPilot-v3.3.0-Android-APK
          path: dist/OfferPilot-v3.3.0.apk
          retention-days: 30

      - name: 🎉 Create Release & Attach APK (仅在打 Tag 时触发)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OfferPilot-v3.3.0.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
