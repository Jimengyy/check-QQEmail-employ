name: Build Windows EXE

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'client/**'
      - 'docs/assets/AppIcon.ico'
      - '.github/workflows/build_windows_exe.yml'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 编译 Windows 独立免安装 EXE
    runs-on: windows-latest

    steps:
      - name: 📥 检出仓库代码
        uses: actions/checkout@v4

      - name: 🐍 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装编译工具与项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flask pillow requests

      - name: 🏗️ 使用 PyInstaller 编译单文件免安装 EXE
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if (-not $ver.StartsWith("v")) {
              $ver = "v3.4.0"
          }
          $exeName = "OfferPilot-Windows-$ver"
          Write-Host "🔨 正在使用版本标签: $ver 构建 EXE ($exeName)..."
          pyinstaller --clean --onefile --noconsole --name "$exeName" --icon "docs/assets/AppIcon.ico" --add-data "client/admin;client/admin" --add-data "client/widget;client/widget" --add-data "config.example.json;." client/windows_launcher.py

      - name: 🏷️ 校验构建产物
        shell: pwsh
        run: |
          $files = Get-ChildItem "dist/*.exe"
          if ($files.Count -gt 0) {
              foreach ($f in $files) {
                  $size = $f.Length / 1MB
                  Write-Host "✅ 构建成功: $($f.Name) 大小: $([math]::Round($size, 2)) MB"
              }
          } else {
              Write-Error "❌ 未在 dist 目录下找到编译输出文件！"
              exit 1
          }

      - name: 📤 上传 EXE 到 Actions Artifacts (供测试下载)
        uses: actions/upload-artifact@v4
        with:
          name: OfferPilot-Windows-EXE
          path: dist/*.exe
          retention-days: 30

      - name: 🚀 自动挂载到 GitHub Release 附件列表 (Release 时自动触发)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
