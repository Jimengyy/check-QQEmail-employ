name: Build macOS DMG

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths:
      - 'client/**'
      - 'scripts/*mac*'
      - 'tests/test_mac_packaging.py'
      - 'docs/assets/AppIcon.icns'
      - '.github/workflows/build_mac_dmg.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-mac:
    name: macOS DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-mac-build.txt

      - name: 安装独立运行环境和打包依赖
        run: python -m pip install -r scripts/requirements-mac-build.txt

      - name: 回归测试（配置不得写入签名包）
        run: python -m unittest discover -s tests -p test_mac_packaging.py -v

      - name: 配置正式发布签名及公证（缺失时拒绝发布）
        if: github.event_name == 'release'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::缺少正式 Mac 发布凭据：$variable；不会上传未公证包。"
              exit 1
            fi
          done
          KEYCHAIN_PATH="$RUNNER_TEMP/offerpilot-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/offerpilot-certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/offerpilot-certificate.p12" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          xcrun notarytool store-credentials OfferPilotNotary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN_PATH"
          echo "MACOS_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_PROFILE=OfferPilotNotary" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "REQUIRE_NOTARIZATION=1" >> "$GITHUB_ENV"

      - name: 构建、签名、验证镜像及内置运行环境
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          VERSION=3.4.1
          if [[ "$EVENT_NAME" == release ]]; then VERSION="$REF_NAME"; fi
          bash scripts/build_mac_app.sh "$VERSION"

      - name: 上传测试/正式产物
        uses: actions/upload-artifact@v4
        with:
          name: OfferPilot-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: 仅将通过公证和镜像校验的安装包上传 Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.sha256
          fail_on_unmatched_files: true

      - name: 清理 CI 临时证书
        if: always() && github.event_name == 'release'
        run: |
          security delete-keychain "$RUNNER_TEMP/offerpilot-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/offerpilot-certificate.p12"
