<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招聘助手挂件</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="widget-container" id="app">
        <header>
            <h1>招聘任务</h1>
            <div id="status-dot" class="online"></div>
        </header>
        <div class="main-content" id="main-content">
            <div class="section-header" id="pending-header">
                <h2>待处理</h2>
                <span class="count-badge" id="pending-count">0</span>
            </div>
            <div class="task-list" id="task-list">
                <div class="loading">正在同步邮箱数据...</div>
            </div>

            <div class="section-header" id="history-header">
                <h2>历史记录</h2>
                <span class="count-badge" id="history-count">0</span>
            </div>
            <div class="task-list history-list collapsed" id="history-list">
                <!-- Completed tasks will be injected here -->
            </div>
        </div>
        <footer>
            <span id="last-sync">最后同步: --:--</span>
            <button id="refresh-btn">↻</button>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
