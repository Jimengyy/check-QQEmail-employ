<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招聘智能助手 - 后台管理台</title>
    <link rel="stylesheet" href="/web_admin/style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h2>后台管理</h2>
            <nav>
                <a href="#" class="active" data-target="review-view">审核大厅 <span class="badge" id="review-badge">0</span></a>
                <a href="#" data-target="dashboard-view">招聘进度看板</a>
            </nav>
        </aside>

        <main class="content">
            <!-- 审核页面 -->
            <section id="review-view" class="view active">
                <header>
                    <h1>待审核任务</h1>
                    <button class="btn btn-primary" onclick="loadReviews()">刷新</button>
                </header>
                <div class="card">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>抓取时间</th>
                                <th>公司</th>
                                <th>类型</th>
                                <th>任务时间</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="review-tbody">
                            <!-- JS injected -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- 进度看板页面 -->
            <section id="dashboard-view" class="view">
                <header>
                    <h1>招聘进度看板</h1>
                    <button class="btn btn-primary" onclick="loadDashboard()">刷新</button>
                </header>
                <div class="card">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>投递公司</th>
                                <th>最新进展类型</th>
                                <th>最新进展时间</th>
                                <th>总交互次数</th>
                                <th>当前状态</th>
                            </tr>
                        </thead>
                        <tbody id="dashboard-tbody">
                            <!-- JS injected -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="/web_admin/app.js"></script>
</body>
</html>
